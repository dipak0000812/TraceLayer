openapi: 3.0.3
info:
  title: TraceLayer Go API
  version: 0.1.0
  description: Current public HTTP contract for the TraceLayer backend.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: PostgreSQL-backed API health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/InternalError'
  /api/v1/ingest/blockchain:
    post:
      operationId: ingestBlockchain
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '200':
          description: Ingestion result emitted by the current handler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/ingest/network:
    post:
      operationId: ingestNetwork
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '200':
          description: Ingestion result emitted by the current handler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/correlate:
    post:
      operationId: correlate
      responses:
        '200':
          description: Correlation, entity resolution, and ranking result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelateResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/evidence/{txid}:
    get:
      operationId: getEvidence
      parameters:
        - $ref: '#/components/parameters/Txid'
      responses:
        '200':
          description: Evidence bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/leads:
    get:
      operationId: listLeads
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, default: 20}
        - name: sort_by
          in: query
          required: false
          schema: {type: string, enum: [fused_rank, rank_shift], default: fused_rank}
      responses:
        '200':
          description: Persisted forensic leads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/leads/{id}:
    get:
      operationId: getLead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Forensic lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    Txid:
      name: txid
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp, services]
      properties:
        status: {type: string}
        timestamp: {type: string, format: date-time}
        services:
          type: object
          additionalProperties: {type: string}
    IngestionResponse:
      type: object
      required: [ingested_count, duplicate_count, rejected_count, dataset_id]
      properties:
        ingested_count: {type: integer}
        duplicate_count: {type: integer}
        rejected_count: {type: integer}
        dataset_id: {type: string}
    CorrelateResponse:
      type: object
      required: [status, entities_clustered, leads_generated, observations_correlated]
      properties:
        status: {type: string}
        entities_clustered: {type: integer}
        leads_generated: {type: integer}
        observations_correlated: {type: integer}
    EvidenceResponse:
      type: object
      required: [transaction, network_observations, quality_metric, disclaimer]
      properties:
        transaction:
          $ref: '#/components/schemas/EvidenceTransaction'
        network_observations:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceObservation'
        quality_metric: {type: number, format: double}
        disclaimer: {type: string}
    EvidenceTransaction:
      type: object
      required: [txid, timestamp, input_addresses, output_addresses, fee, script_type]
      properties:
        txid: {type: string, pattern: '^[0-9a-f]{64}$'}
        timestamp: {type: string, format: date-time}
        input_addresses: {type: array, items: {type: string}}
        output_addresses: {type: array, items: {type: string}}
        fee: {type: string, description: Exact BTC decimal string}
        script_type: {type: string}
    EvidenceObservation:
      type: object
      required: [observation_id, observed_at, first_heard_peer_ip, src_port]
      properties:
        observation_id: {type: string}
        observed_at: {type: string, format: date-time}
        first_heard_peer_ip: {type: string}
        src_port: {type: integer, minimum: 0, maximum: 65535}
        geo_country: {type: string, nullable: true, description: Nullable compatibility field; not a current runtime enrichment requirement}
        asn: {type: string, nullable: true, description: Nullable compatibility field; not a current runtime enrichment requirement}
        propagation_delay_ms: {type: integer, format: int64, nullable: true}
    Lead:
      type: object
      required: [lead_id, entity_id, primary_txid, chain_only_score, network_score, fused_score, chain_only_rank, fused_rank, rank_shift, network_evidence_quality, heuristic_association_strength, anomaly_flags, explanation]
      properties:
        lead_id: {type: string}
        entity_id: {type: string}
        primary_txid: {type: string, pattern: '^[0-9a-f]{64}$'}
        chain_only_score: {type: number, format: double}
        network_score: {type: number, format: double}
        fused_score: {type: number, format: double}
        chain_only_rank: {type: integer}
        fused_rank: {type: integer}
        rank_shift: {type: integer}
        network_evidence_quality: {type: number, format: double}
        heuristic_association_strength: {type: number, format: double}
        anomaly_flags: {type: array, items: {type: string}}
        explanation: {type: string}
    LeadListResponse:
      type: object
      required: [total_leads, page, limit, leads]
      properties:
        total_leads: {type: integer}
        page: {type: integer}
        limit: {type: integer}
        leads:
          type: array
          items:
            $ref: '#/components/schemas/Lead'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, field]
          properties:
            code: {type: string}
            message: {type: string}
            field: {type: string, nullable: true}
  responses:
    BadRequest:
      description: Invalid request or domain value
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InternalError:
      description: Internal or persistence failure
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
